# ko builds the image straight from the Go build: distroless base pinned by
# digest, non-root (uid 65532), multi-arch and an SBOM. No Dockerfile needed.
# https://ko.build
defaultBaseImage: cgr.dev/chainguard/static:latest@sha256:bf639cba19ba56329e6907ac26a7afcdde57a80b6aa66d5100da6883196e6b82
builds:
  - id: randomon
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
