name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2      # pinned, NOT "latest"
          args: --timeout=5m
      - name: Check formatting
        run: golangci-lint fmt --diff

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Build and push image
    needs: [lint, test, secrets]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Leave KO_DOCKER_REPO unset here on purpose: setup-ko only logs in to
      # ghcr.io when it is unset, and it then defaults it to
      # ghcr.io/<owner>/<repo>, which is exactly what --bare needs.
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
      - name: Build and push (distroless, multi-arch, digest-pinned base)
        # On main: "main" keeps the current deployment working and sha-<commit>
        # is an immutable tag. On a release tag (vX.Y.Z, pushed by
        # releaser-pleaser): the bare version, which is what Renovate follows.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="${GITHUB_REF_NAME#v}"
          else
            tags="main,sha-${GITHUB_SHA::7}"
          fi
          ko build --bare \
            --platform=linux/amd64,linux/arm64 \
            --tags="$tags" \
            --image-refs=image-refs.txt \
            .
          echo "Published: $(cat image-refs.txt)"
