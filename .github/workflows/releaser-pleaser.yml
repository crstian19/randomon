name: Releaser Pleaser

# Keeps a release PR open with the next version and the changelog, computed
# from the Conventional Commits on main. Merging that PR tags vX.Y.Z and
# creates the GitHub release; the tag then triggers CI, which publishes the
# versioned image.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - edited
      - labeled

concurrency:
  group: releaser-pleaser
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  releaser-pleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so the
      # release would never be built. The crstian19-releaser GitHub App mints a
      # short-lived token that does, and its key does not expire like a PAT.
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - name: Run Releaser Pleaser
        uses: apricote/releaser-pleaser@93a3e2c401320206dcd9a9b7a5bbc0850072b3c6 # v0.9.0
        with:
          token: ${{ steps.app-token.outputs.token }}
